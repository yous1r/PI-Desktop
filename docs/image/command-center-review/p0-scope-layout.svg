<text x="1155" y="237" font-size="15" fill="#9bb7e2" font-weight="600" text-anchor="middle">01</text>
<text x="1183" y="238" font-size="18" fill="#e7eaef" font-weight="600" >A permanent overview</text>
<text x="1183" y="269" font-size="16" fill="#acb5c1" font-weight="400" >One monitoring surface remains</text>
<text x="1183" y="294" font-size="16" fill="#acb5c1" font-weight="400" >available. No fifth workspace</text>
<text x="1183" y="319" font-size="16" fill="#acb5c1" font-weight="400" >window.</text>
<rect x="1140" y="390" width="30" height="30" rx="8" fill="#263344" stroke="none" />
<text x="1155" y="411" font-size="15" fill="#9bb7e2" font-weight="600" text-anchor="middle">02</text>
<text x="1183" y="412" font-size="18" fill="#e7eaef" font-weight="600" >Three active workspaces</text>
<text x="1183" y="443" font-size="16" fill="#acb5c1" font-weight="400" >Attach to any authorized task. The</text>
<text x="1183" y="468" font-size="16" fill="#acb5c1" font-weight="400" >view never becomes a new Agent.</text>
<rect x="1140" y="564" width="30" height="30" rx="8" fill="#263344" stroke="none" />
<text x="1155" y="585" font-size="15" fill="#9bb7e2" font-weight="600" text-anchor="middle">03</text>
<text x="1183" y="586" font-size="18" fill="#e7eaef" font-weight="600" >Focus on demand</text>
<text x="1183" y="617" font-size="16" fill="#acb5c1" font-weight="400" >Maximize one workspace, then</text>
<text x="1183" y="642" font-size="16" fill="#acb5c1" font-weight="400" >restore the exact previous layout.</text>
<rect x="1140" y="755" width="190" height="28" rx="14" fill="#263344" stroke="none" />
<text x="1152" y="774" font-size="13" fill="#9bb7e2" font-weight="500" >Design constraints</text>
<text x="1140" y="806" font-size="16" fill="#acb5c1" font-weight="400" >Capacity and memory targets require</text>
<text x="1140" y="833" font-size="16" fill="#acb5c1" font-weight="400" >measurement. These are not achieved</text>
<text x="1140" y="860" font-size="16" fill="#acb5c1" font-weight="400" >results.</text>
