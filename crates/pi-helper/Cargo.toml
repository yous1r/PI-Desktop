[package]
name = "pi-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PI-Desktop remote mirror helper service"

[[bin]]
name = "pi-helper"
path = "src/main.rs"

[dependencies]
hex = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "sync", "signal", "time"] }


[dev-dependencies]
tempfile = "3"
