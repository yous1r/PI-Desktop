name: Hotfix pi-host bundle

# Temporary packaging lane for a `hotfix-*` branch: it builds the static
# host-core, assembles the Linux `pi-host` bundle, and uploads the archive with
# its checksum so one machine can be fixed without waiting for a tag. Publishing
# stays with `.github/workflows/release.yml`; this workflow only produces
# downloadable artifacts.

on:
  push:
    branches: ['hotfix-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotfix-pi-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle pi-host (linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-22.04
            runner_arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-22.04-arm
            runner_arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Verify native runner architecture
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.runner_arch }}"
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "::error::Expected $expected_arch runner, got $actual_arch."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build static host-core
        # .cargo/config.toml already pins musl-gcc and the static link for this
        # target, so the plain target build is what the bundle ships.
        run: cargo build --release --locked -p host-core --target ${{ matrix.target }}

      - name: Verify the binary resolves nothing dynamically
        # A failure here has to be readable without the job log, so the reported
        # reason and the raw ELF report both become annotations.
        run: |
          set -uo pipefail
          binary=target/${{ matrix.target }}/release/pi-desktop-host-core
          status=0
          out=$(node scripts/check-linux-host-static.mjs "$binary" 2>&1) || status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            printf '::error title=static check::%s\n' "$(printf '%s' "$out" | head -c 1500 | tr '\n' ' ')"
            printf '::error title=file::%s\n' "$(file -b "$binary" 2>&1 | tr '\n' ' ')"
            exit 1
          fi

      - name: Start the static binary where no glibc exists
        # readelf proves the link; only a machine without glibc proves the
        # process. This covers host-core alone: the bundle's Node runtime keeps
        # Node's own requirement, so musl-only distributions stay unsupported.
        run: |
          set -euo pipefail
          docker run --rm -i --volume "$PWD:/work:ro" --workdir /work alpine:3.20 sh -s <<'SMOKE'
          set -u
          log=$(mktemp)
          status=0
          timeout 20 ./target/${{ matrix.target }}/release/pi-desktop-host-core </dev/null >"$log" 2>&1 || status=$?
          cat "$log"
          if grep -Eq 'error while loading shared libraries|GLIBC_[0-9]' "$log"; then
            echo "static host-core could not load under musl" >&2
            exit 1
          fi
          echo "static host-core started under musl (exit $status)"
          SMOKE

      - name: Assemble the pi-host bundle
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build:js
          pnpm --filter @pi-desktop/agent-runtime bundle
          pnpm --filter @pi-desktop/pi-host build
          node apps/pi-host/scripts/bundle.mjs \
            --platform linux \
            --arch ${{ matrix.arch }} \
            --host-core target/${{ matrix.target }}/release/pi-desktop-host-core

      - name: Archive the bundle with its checksum
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/pi-host/package.json').version")"
          name="pi-host-${version}-linux-${{ matrix.arch }}"
          out=apps/pi-host/dist-bundle
          if [ ! -d "$out/$name" ]; then
            echo "::error::expected the bundle directory $out/$name"
            ls -la "$out" || true
            exit 1
          fi
          tar -czf "$out/${name}.tar.gz" -C "$out" "$name"
          ( cd "$out" && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          cat "$out/${name}.tar.gz.sha256"
          {
            echo "### Hotfix pi-host bundle (linux ${{ matrix.arch }})"
            echo
            echo '```'
            cat "$out/${name}.tar.gz.sha256"
            echo '```'
            echo
            echo "Size: $(du -h "$out/${name}.tar.gz" | cut -f1)"
            echo
            echo 'Install on the target machine, then start it with a pairing token:'
            echo '```sh'
            echo "tar -xzf ${name}.tar.gz"
            echo "sh ${name}/install.sh"
            echo "~/.pi-desktop/pi-host/current/bin/pi-host --port 0 --pair"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: pi-host-hotfix-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/pi-host/dist-bundle/pi-host-*-linux-${{ matrix.arch }}.tar.gz
            apps/pi-host/dist-bundle/pi-host-*-linux-${{ matrix.arch }}.tar.gz.sha256
